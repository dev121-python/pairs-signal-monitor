name: Daily Signal Update

on:
  schedule:
    - cron: '0 22 * * 1-5'   # 22:00 UTC, Mon-Fri, after US market close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python run_daily_signal.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python export_history.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Commit history backup
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add signal_history.csv
          git diff --staged --quiet || git commit -m "update signal history"
          git push